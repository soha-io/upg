[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "upg"
version = "0.1.0"
description = "Unified Person Graph — the Eight-Dimension model as a tested, computable toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "License decision pending; no blanket grant in this snapshot" }
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]
study = [
  "matplotlib>=3.7",
  "networkx>=3.1",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.scripts]
upg-preflight = "upg.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
upg = ["data/*.csv"]

[tool.pytest.ini_options]
# Lets `pytest` find the package without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
