[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "upg"
version = "0.1.0"
description = "Unified Person Graph — the Eight-Dimension model as a tested, computable toolkit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary — research use" }
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
upg = ["data/*.csv"]

[tool.pytest.ini_options]
# Lets `pytest` find the package without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
