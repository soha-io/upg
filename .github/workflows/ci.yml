name: preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install locked development and study environment
        run: uv sync --locked --extra dev --extra study
      - name: Run tests
        run: uv run --locked pytest
      - name: Run artifact preflight
        run: uv run --locked upg-preflight --skip-tests
